name: H68K-C-D-F-USB-OpenWrt-Main

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      BUILD_CONFIG_ONLY:
        description: "仅生成完整 .config，不编译固件"
        required: true
        default: true
        type: boolean

env:
  TZ: Asia/Shanghai
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_BRANCH: main
  HINLINK_REPO: https://github.com/Beaverfffan/immortalwrt-hinlink.git
  HINLINK_BRANCH: main
  DEVICE_ID: hinlink_opc-h68k-c-d-f-usb
  DEVICE_DTS: rk3568-hinlink-h68k-c-d-f-usb
  TARGET: rockchip
  SUBTARGET: armv8

jobs:
  build:
    name: H68K C/D/F USB - OpenWrt main
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set build information
        shell: bash
        run: |
          echo "BUILD_DATE=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
          echo "BUILD_CONFIG_ONLY=${{ inputs.BUILD_CONFIG_ONLY }}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl \
            device-tree-compiler libelf-dev libzstd-dev \
            qemu-utils util-linux xsltproc zstd

      - name: Clone OpenWrt main
        shell: bash
        run: |
          git clone --depth=1 \
            --branch "$OPENWRT_BRANCH" \
            "$OPENWRT_REPO" openwrt

          git -C openwrt log -1 --format='OpenWrt commit: %H'

      - name: Clone HINLINK hardware adaptation repository
        shell: bash
        run: |
          git clone --depth=1 \
            --branch "$HINLINK_BRANCH" \
            "$HINLINK_REPO" hinlink-adapt

          git -C hinlink-adapt log -1 --format='HINLINK adaptation commit: %H'

      - name: Integrate H68K C/D/F USB DTS dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          repo = Path("openwrt")
          adapt = Path("hinlink-adapt")

          src_dir = (
              adapt / "target/linux/rockchip/files/"
              "arch/arm64/boot/dts/rockchip"
          )
          dst_dir = (
              repo / "target/linux/rockchip/files/"
              "arch/arm64/boot/dts/rockchip"
          )

          root_dts = src_dir / "rk3568-hinlink-h68k-c-d-f-usb.dts"

          if not root_dts.is_file():
              raise SystemExit(
                  f"ERROR: adaptation DTS not found: {root_dts}"
              )

          dst_dir.mkdir(parents=True, exist_ok=True)

          copied = set()
          visiting = set()

          def copy_dts(path):
              path = path.resolve()

              if path in copied:
                  return

              if path in visiting:
                  return

              if not path.is_file():
                  raise SystemExit(f"ERROR: missing DTS dependency: {path}")

              visiting.add(path)

              target = dst_dir / path.name
              shutil.copy2(path, target)
              copied.add(path)

              content = path.read_text(encoding="utf-8")

              for include in re.findall(
                  r'^\s*#include\s+"([^"]+)"',
                  content,
                  flags=re.MULTILINE
              ):
                  # 只递归复制适配仓库中实际提供的本地文件。
                  # rk3568.dtsi 等主线文件由 OpenWrt/Linux 提供。
                  dep = (path.parent / include).resolve()

                  if dep.is_file():
                      if dep.parent != src_dir.resolve():
                          raise SystemExit(
                              "ERROR: unexpected DTS include path: "
                              f"{dep}"
                          )
                      copy_dts(dep)

              visiting.remove(path)

          copy_dts(root_dts)

          print("Copied DTS files:")
          for path in sorted(copied):
              print(f"  {path.name}")

          print(f"Total DTS/DTSI files copied: {len(copied)}")
          PY

      - name: Add dedicated OpenWrt device definition
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("openwrt/target/linux/rockchip/image/armv8.mk")
          text = p.read_text(encoding="utf-8")

          device_id = "hinlink_opc-h68k-c-d-f-usb"

          if f"TARGET_DEVICES += {device_id}" in text:
              print("Device definition already exists; not duplicating it.")
          else:
              marker = "define Device/hinlink_h68k\n"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: OpenWrt main does not contain "
                      "Device/hinlink_h68k; refusing to guess the base."
                  )

              block = f"""
          # HINLINK H68K C/D/F USB variant
          # Based on the upstream H68K device definition.
          define Device/{device_id}
            $(Device/hinlink_h68k)
            DEVICE_MODEL := OPC-H68K C/D/F USB3.0
            DEVICE_DTS := rk3568-hinlink-h68k-c-d-f-usb
            UBOOT_DEVICE_NAME := hinlink-h68k-rk3568
          endef
          TARGET_DEVICES += {device_id}
          """

              p.write_text(
                  text.rstrip() + "\n\n" + block.lstrip(),
                  encoding="utf-8"
              )

              print(f"Added Device/{device_id}")

          check = p.read_text(encoding="utf-8")

          for required in (
              f"define Device/{device_id}",
              "DEVICE_DTS := rk3568-hinlink-h68k-c-d-f-usb",
              f"TARGET_DEVICES += {device_id}",
          ):
              if required not in check:
                  raise SystemExit(
                      f"ERROR: device definition validation failed: {required}"
                  )
          PY

      - name: Integrate H68K board network and LED settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          base = Path(
              "openwrt/target/linux/rockchip/armv8/"
              "base-files/etc/board.d"
          )

          network = base / "02_network"
          leds = base / "01_leds"

          board = "hinlink,opc-h68k-c-d-f-usb"

          def insert_before(text, pattern, addition, label):
              if board in text:
                  print(f"{label}: board compatible already present")
                  return text

              match = re.search(pattern, text, flags=re.MULTILINE)

              if not match:
                  raise SystemExit(
                      f"ERROR: cannot locate a safe insertion point in {label}"
                  )

              indent = match.group(1)
              block = addition(indent)

              return text[:match.start()] + block + text[match.start():]

          # 02_network: add the exact compatible branch before the generic
          # hinlink,h68k branch. Do not assume that a *) fallback exists
          # at the insertion point.
          text = network.read_text(encoding="utf-8")

          pattern = r'^([ \t]*)hinlink,h68k\)$'

          def network_branch(indent):
              tab = indent + "\t"
              return (
                  f"{indent}{board})\n"
                  f"{tab}ucidef_set_interfaces_lan_wan "
                  f"'eth1 eth2 eth3' 'eth0'\n"
                  f"{tab};;\n"
              )

          text = insert_before(
              text, pattern, network_branch, "02_network interfaces"
          )

          # Add the exact compatible to the MAC-generation case block.
          # The upstream case uses a continuation list ending in hinlink,h68k|.
          if board not in text:
              start = text.find("rockchip_setup_macs()")

              if start < 0:
                  raise SystemExit(
                      "ERROR: rockchip_setup_macs() not found"
                  )

              before = text[:start]
              tail = text[start:]

              pattern_mac = r'^([ \t]*)hinlink,h68k\|\\?$'

              def mac_branch(indent):
                  return f"{indent}{board}|\\\n"

              tail = insert_before(
                  tail, pattern_mac, mac_branch, "02_network MAC"
              )
              text = before + tail

          network.write_text(text, encoding="utf-8")

          # 01_leds: this DTS uses color/function LED names, including
          # blue:wan. WAN is eth0 on the C/D/F USB variant.
          text = leds.read_text(encoding="utf-8")

          def led_branch(indent):
              tab = indent + "\t"
              return (
                  f"{indent}{board})\n"
                  f'{tab}ucidef_set_led_netdev "wan" "WAN" '
                  f'"blue:wan" "eth0"\n'
                  f"{tab};;\n"
              )

          text = insert_before(
              text,
              r'^([ \t]*)hinlink,h68k\)$',
              led_branch,
              "01_leds"
          )

          leds.write_text(text, encoding="utf-8")

          # Validate exact branches and preserve the upstream fallback.
          network_text = network.read_text(encoding="utf-8")
          leds_text = leds.read_text(encoding="utf-8")

          if board not in network_text:
              raise SystemExit("ERROR: network compatible was not installed")

          if board not in leds_text:
              raise SystemExit("ERROR: LED compatible was not installed")

          if "ucidef_set_interfaces_lan_wan 'eth1 eth2 eth3' 'eth0'" not in network_text:
              raise SystemExit("ERROR: expected LAN/WAN mapping not found")

          if 'ucidef_set_led_netdev "wan" "WAN" "blue:wan" "eth0"' not in leds_text:
              raise SystemExit("ERROR: expected WAN LED mapping not found")

          print("Board network and LED integration validated.")
          PY

      - name: Register the dedicated DTS in the Linux build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p openwrt/target/linux/rockchip/patches-6.18

          PATCH="openwrt/target/linux/rockchip/patches-6.18/999-add-h68k-c-d-f-usb-dtb.patch"

          cat > "$PATCH" <<'PATCH'
          --- a/arch/arm64/boot/dts/rockchip/Makefile
          +++ b/arch/arm64/boot/dts/rockchip/Makefile
          @@ -1,1 +1,2 @@
           dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-hinlink-h68k.dtb
          +dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3568-hinlink-h68k-c-d-f-usb.dtb
          PATCH

          echo "Created DTS registration patch:"
          cat "$PATCH"

      - name: Verify integrated source files
        shell: bash
        run: |
          set -euo pipefail

          test -f \
            "openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/${DEVICE_DTS}.dts"

          grep -q \
            "TARGET_DEVICES += ${DEVICE_ID}" \
            openwrt/target/linux/rockchip/image/armv8.mk

          grep -q \
            "hinlink,opc-h68k-c-d-f-usb" \
            openwrt/target/linux/rockchip/armv8/base-files/etc/board.d/02_network

          grep -q \
            "hinlink,opc-h68k-c-d-f-usb" \
            openwrt/target/linux/rockchip/armv8/base-files/etc/board.d/01_leds

          echo "All integration source checks passed."

      - name: Update and install feeds
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate minimal H68K C/D/F USB configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<EOF
          CONFIG_TARGET_${TARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}=y
          CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_ID}=y
          EOF

          make defconfig

          if ! grep -qx \
            "CONFIG_TARGET_${TARGET}_${SUBTARGET}_DEVICE_${DEVICE_ID}=y" \
            .config; then
            echo "ERROR: selected device disappeared after make defconfig"
            grep '^CONFIG_TARGET_.*DEVICE_.*=y' .config || true
            exit 1
          fi

          mkdir -p config-output
          cp .config "config-output/${DEVICE_ID}_${BUILD_DATE}.config"

          echo "Selected device:"
          grep '^CONFIG_TARGET_.*DEVICE_.*=y' .config

      - name: Upload full OpenWrt configuration
        if: env.BUILD_CONFIG_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-main-${{ env.DEVICE_ID }}-config-${{ env.BUILD_DATE }}
          path: openwrt/config-output/*.config
          if-no-files-found: error
          retention-days: 14

      - name: Download package sources
        if: env.BUILD_CONFIG_ONLY != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: Compile firmware
        id: compile
        if: env.BUILD_CONFIG_ONLY != 'true'
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j"$(nproc)" || make -j1 V=s

      - name: Verify generated firmware files
        if: steps.compile.outcome == 'success'
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          TARGET_DIR="bin/targets/${TARGET}/${SUBTARGET}"

          if [ ! -d "$TARGET_DIR" ]; then
            echo "ERROR: target output directory not found: $TARGET_DIR"
            find bin/targets -maxdepth 3 -type f -print || true
            exit 1
          fi

          find "$TARGET_DIR" -maxdepth 2 -type f -print

          if ! find "$TARGET_DIR" -type f \
            \( -name '*hinlink*' -o -name '*.img.gz' -o -name '*.bin' \) \
            -print -quit | grep -q .; then
            echo "ERROR: no expected firmware image was found"
            exit 1
          fi

      - name: Upload firmware and build artifacts
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-main-${{ env.DEVICE_ID }}-${{ env.BUILD_DATE }}
          path: |
            openwrt/bin/targets/rockchip/armv8/
            openwrt/.config
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: steps.compile.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: h68k-c-d-f-usb-main-${{ env.RELEASE_DATE }}-${{ github.run_number }}
          name: H68K C/D/F USB - OpenWrt main - ${{ env.BUILD_DATE }}
          body: |
            HINLINK H68K C/D/F USB
            Source: OpenWrt main
            Device ID: ${{ env.DEVICE_ID }}
            DTS: ${{ env.DEVICE_DTS }}

            Note: firmware is built from OpenWrt main with the dedicated
            HINLINK device tree and board configuration integrated.
          files: |
            openwrt/bin/targets/rockchip/armv8/*
