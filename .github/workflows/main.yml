# 工作流名称
name: OpenWrt 编译

# 授予 GITHUB_TOKEN 完整写权限，用于 Release 等操作
permissions: write-all

# 仅允许手动启动
on:
  workflow_dispatch:

# 全局参数
env:
  OPENWRT_NAME: OpenWrt                                      # 固件名称
  SOURCE_REPO: https://github.com/openwrt/openwrt.git       # OpenWrt 主线仓库
  SOURCE_BRANCH: main                                        # OpenWrt 主线分支
  CONFIG_FILE: config/h68k.txt                              # H68K 配置文件
  PATCH_DIR: patch                                           # 主线 Patch 目录
  DIY_DIR: scripts                                           # DIY 脚本目录
  UPLOAD_BIN: true                                           # 是否上传完整 bin
  UPLOAD_FIRMWARE: true                                      # 是否上传固件
  UPLOAD_RELEASE: true                                       # 是否创建 Release
  TZ: Asia/Shanghai                                          # 编译时区

# 编译任务
jobs:
  build:
    name: 编译 OpenWrt                                      # 任务名称
    runs-on: ubuntu-24.04                                   # 使用 Ubuntu 24.04

    steps:
      # 检出当前配置仓库
      - name: 检出配置
        uses: actions/checkout@v4                           # 官方 Checkout
        with:
          ref: main                                         # 使用 main
          fetch-depth: 1                                    # 只取最新提交

      # 清理 Runner 磁盘空间
      - name: 清理磁盘
        uses: coder-xiaomo/free-disk-space@main             # 磁盘清理工具
        with:
          android: true                                     # 清理 Android
          dotnet: true                                      # 清理 .NET
          haskell: true                                     # 清理 Haskell
          large-packages: true                              # 清理大型软件包
          docker-images: true                               # 清理 Docker
          swap-storage: true                                # 清理 Swap

      # 安装 OpenWrt 编译依赖
      - name: 安装依赖
        run: |
          set -euxo pipefail                                # 严格错误处理
          sudo apt-get update                                # 更新软件源
          sudo apt-get install -y \                          # 安装依赖
            bc binutils build-essential bzip2 ccache clang curl file \
            flex bison g++ gawk gcc-multilib g++-multilib gettext git \
            help2man libbsd-dev libelf-dev liblzma-dev libncurses-dev \
            libssl-dev make meson ninja-build pkg-config python3 \
            python3-dev python3-setuptools rsync subversion swig \
            texinfo time u-boot-tools unzip wget xsltproc xxd \
            zlib1g-dev zstd mtd-utils device-tree-compiler
          sudo apt-get clean                                 # 清理 APT 缓存

      # 下载 OpenWrt 主线源码
      - name: 下载源码
        run: |
          set -euxo pipefail                                # 严格错误处理
          git clone --depth 1 --single-branch \              # 浅克隆主线
            -b "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cd openwrt                                         # 进入源码目录
          git rev-parse HEAD                                 # 输出源码 Commit

      # 写入 H68K 配置并执行所有 Patch/DIY
      - name: 配置
        working-directory: openwrt
        run: |
          set -euo pipefail                                 # 严格错误处理

          cp "../$CONFIG_FILE" .config                       # 写入 H68K 配置
          test -s .config                                    # 检查配置非空
          grep -q \                                           # 确认目标为 H68K
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_h68k=y$' \
            .config

          for script in ../$PATCH_DIR/*.sh; do              # 遍历所有 Patch
            [ -f "$script" ] || continue                     # 跳过不存在文件
            bash "$script"                                   # 执行 Patch
          done

          for script in ../$DIY_DIR/*.sh; do                # 遍历所有 DIY
            [ -f "$script" ] || continue                     # 跳过不存在文件
            bash "$script"                                   # 执行 DIY
          done

          make defconfig                                     # 生成最终配置

          grep -q \                                           # 再次确认 H68K
            '^CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_h68k=y$' \
            .config

      # 缓存源码下载和 ccache
      - name: 缓存
        uses: actions/cache@v4                              # GitHub 官方缓存
        with:
          path: |                                            # 缓存目录
            openwrt/dl
            openwrt/.ccache
          key: openwrt-${{ runner.os }}-${{ hashFiles('config/h68k.txt', 'patch/*.sh', 'scripts/*.sh', 'openwrt/.config') }} # 精确缓存键
          restore-keys: |                                    # 找不到精确缓存时回退
            openwrt-${{ runner.os }}-

      # 下载源码并开始编译
      - name: 下载并编译
        working-directory: openwrt
        run: |
          set -o pipefail                                    # 保留管道错误
          make download -j"$(nproc)" V=s                     # 并行下载源码

          if make -j"$(nproc)" V=s 2>&1 | tee ../build-parallel.log; then # 多线程编译
            echo "并行编译成功"                              # 编译成功
          else
            echo "并行编译失败，开始 -j1 重试"               # 编译失败提示
            make -j1 V=s 2>&1 | tee ../build-single.log      # 单线程重试，不 clean
          fi

      # 检查最终固件目录
      - name: 检查固件
        if: success()                                       # 仅编译成功执行
        run: |
          set -euxo pipefail                                # 严格错误处理
          test -d openwrt/bin/targets                        # 确认输出目录存在
          find openwrt/bin/targets -type f -printf '%p\n' | sort # 列出全部输出

      # 上传编译日志
      - name: 上传日志
        if: always()                                        # 无论成功失败都上传
        uses: actions/upload-artifact@v4                     # 上传 Artifact
        with:
          name: ${{ env.OPENWRT_NAME }}-Build-Logs          # 日志名称
          path: |                                            # 日志文件
            build-parallel.log
            build-single.log
          if-no-files-found: ignore                          # 无日志也不失败
          retention-days: 7                                  # 保留 7 天

      # 上传完整 bin/targets
      - name: 上传 bin
        if: success() && env.UPLOAD_BIN == 'true'            # 成功且开启上传
        uses: actions/upload-artifact@v4                     # 上传 Artifact
        with:
          name: ${{ env.OPENWRT_NAME }}-bin                 # Artifact 名称
          path: openwrt/bin/targets/                         # 完整输出目录
          if-no-files-found: error                           # 没文件则失败
          retention-days: 7                                  # 保留 7 天

      # 上传主要固件文件
      - name: 上传固件
        if: success() && env.UPLOAD_FIRMWARE == 'true'       # 成功且开启上传
        uses: actions/upload-artifact@v4                     # 上传 Artifact
        with:
          name: ${{ env.OPENWRT_NAME }}-Firmware            # 固件名称
          path: |                                            # 固件文件类型
            openwrt/bin/targets/**/*.bin
            openwrt/bin/targets/**/*.itb
            openwrt/bin/targets/**/*.img
            openwrt/bin/targets/**/*.gz
            openwrt/bin/targets/**/*.zip
            openwrt/bin/targets/**/*.manifest
            openwrt/bin/targets/**/*.json
            openwrt/bin/targets/**/*.sha256
          if-no-files-found: warn                            # 没匹配文件只警告
          retention-days: 7                                  # 保留 7 天

      # 自动创建 GitHub Release
      - name: 创建 Release
        if: success() && env.UPLOAD_RELEASE == 'true'        # 成功且开启 Release
        env:
          GH_TOKEN: ${{ github.token }}                      # GitHub API Token
        run: |
          set -euo pipefail                                 # 严格错误处理

          TAG="h68k-$(date '+%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}" # 唯一 Release 标签
          mkdir -p release-assets                            # 创建 Release 文件目录

          find openwrt/bin/targets -type f \                # 搜索最终文件
            \( -name '*.bin' -o -name '*.itb' -o -name '*.img' \
            -o -name '*.gz' -o -name '*.zip' -o -name '*.manifest' \
            -o -name '*.json' -o -name '*.sha256' \) \
            -exec cp -t release-assets {} +                 # 复制到 Release 目录

          test -n "$(find release-assets -type f -print -quit)" # 确认存在固件

          COMMIT="$(cd openwrt && git rev-parse HEAD)"       # 获取 OpenWrt Commit

          cat > release-notes.md <<EOF                       # 生成 Release 说明
          # OpenWrt H68K
          - Target: HINLINK H68K
          - Source: OpenWrt main
          - OpenWrt commit: \`$COMMIT\`
          - Build commit: \`$GITHUB_SHA\`
          - Build time: $(date '+%Y-%m-%d %H:%M:%S %Z')
          - Google BBRv3
          - SONiC Full Cone NAT
          EOF

          gh release create "$TAG" \                         # 创建 Release 并上传文件
            release-assets/* \                               # 上传全部固件
            --target "$GITHUB_SHA" \                         # Release 对应当前配置提交
            --title "OpenWrt H68K $TAG" \                    # Release 标题
            --notes-file release-notes.md \                  # Release 说明
            --latest                                         # 标记为 Latest
