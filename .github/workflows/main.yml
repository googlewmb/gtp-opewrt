name: OpenWrt H68K
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release after successful verification
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: h68k-${{ github.ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Shanghai
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang llvm lld flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev zlib1g-dev python3 python3-setuptools python3-pyelftools \
            python3-ply python3-yaml rsync unzip zstd file wget curl ccache \
            swig time xsltproc subversion patch pkgconf libtool autoconf automake \
            cmake ninja-build libgmp-dev libmpc-dev libmpfr-dev texinfo help2man \
            libgnutls28-dev gperf libfuse-dev device-tree-compiler qemu-utils
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install DAED host tools
        run: npm install --global pnpm@10.24.0
      - name: Checkout official OpenWrt main
        run: |
          git clone --depth 1 --branch main https://github.com/openwrt/openwrt.git openwrt
          cp config/h68k.txt openwrt/.config
          mkdir -p openwrt/build-info
      - uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            openwrt/.ccache
          key: h68k-${{ runner.os }}-${{ hashFiles('config/**', 'scripts/**', 'patch/**') }}-${{ github.run_id }}
          restore-keys: |
            h68k-${{ runner.os }}-${{ hashFiles('config/**', 'scripts/**', 'patch/**') }}-
            h68k-${{ runner.os }}-
      - name: Prepare feeds, packages and SONiC
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            python3 ../scripts/prepare.py target
            bash ../scripts/diy1.sh
            bash ../scripts/diy2.sh
            make defconfig
            python3 ../scripts/prepare.py translations
            make defconfig
            python3 ../scripts/prepare.py config-check
          } 2>&1 | tee ../prepare.log
      - name: Download sources
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 V=s 2>&1 | tee ../download.log
      - name: Build host tools and cross toolchain
        working-directory: openwrt
        run: |
          set -euo pipefail
          for target in tools/install toolchain/install; do
            if ! make "$target" -j"$(nproc)" V=s 2>&1 | tee -a ../toolchain.log; then
              make "$target" -j1 V=s 2>&1 | tee -a ../toolchain-single.log
            fi
          done
      - name: Adapt and compile Google BBRv3 kernel
        working-directory: openwrt
        run: |
          set -euo pipefail
          bash ../patch/public1.sh 2>&1 | tee ../kernel.log
      - name: Build firmware
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee ../build-parallel.log; then
            make -j1 V=s 2>&1 | tee ../build-single.log
          fi
          python3 ../scripts/prepare.py artifacts
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: H68K-logs-${{ github.run_number }}
          path: |
            *.log
            openwrt/build-info
            openwrt/logs
            openwrt/target/linux/rockchip/patches-*/999-google-bbrv3.patch
          if-no-files-found: warn
          retention-days: 14
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: H68K-firmware-${{ github.run_number }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified build
        if: inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="h68k-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          tar -czf release-assets/build-info.tar.gz -C release-assets build-info
          {
            echo 'Official OpenWrt main / HINLINK H68K / RK3568'
            echo
            echo "Build configuration: $GITHUB_SHA"
            echo 'Google BBR team BBRv3, SONiC fw4 fullcone and DAED.'
            echo 'Firmware, manifest and SHA256 verified; hardware boot is not tested by CI.'
            echo
            cat openwrt/build-info/sources.txt
            cat openwrt/build-info/bbr.json
          } > release-notes.md
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "OpenWrt H68K $tag" --notes-file release-notes.md