# 工作流名称：官方主线 H68K 固件
name: OpenWrt H68K 编译

# 创建 Release 需要内容写权限
permissions:
  contents: write

# 仅手动启动，可单独关闭发布
on:
  workflow_dispatch:
    inputs:
      release:
        description: 验证成功后创建 Release
        type: boolean
        default: true

# 同一分支依次构建，不中断已有任务
concurrency:
  group: h68k-${{ github.ref }}
  cancel-in-progress: false

# 全局配置：常用开关集中管理
env:
  OPENWRT_NAME: OpenWrt-H68K                      # 固件名称
  SOURCE_REPO: https://github.com/openwrt/openwrt.git # 官方源码
  SOURCE_BRANCH: main                            # 主线分支
  CONFIG_FILE: config/h68k.txt                     # 固件配置
  PATCH_DIR: patch                               # 统一补丁目录
  UPLOAD_BIN: 'true'                              # 上传完整目标输出
  UPLOAD_FIRMWARE: 'true'                         # 上传已验证固件
  UPLOAD_RELEASE: 'true'                          # 允许发布 Release
  TZ: Asia/Shanghai                              # 编译时区
  CCACHE_DIR: ${{ github.workspace }}/openwrt/.ccache # 编译缓存

jobs:
  build:
    name: 编译 OpenWrt H68K
    runs-on: ubuntu-24.04                         # 编译系统
    timeout-minutes: 360                          # 最长运行时间
    defaults:
      run:
        shell: bash
    steps:
      # 第一阶段：配置仓库、磁盘和主机环境
      - name: 01 检出配置仓库
        uses: actions/checkout@v5

      - name: 02 清理磁盘
        run: |
          # 清理 Runner 预装且编译无需使用的 SDK
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: 03 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          # OpenWrt 工具链、DAED BPF 编译及 Python 补丁处理依赖
          sudo apt-get install -y build-essential clang llvm lld flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            libelf-dev zlib1g-dev python3 python3-setuptools python3-pyelftools \
            python3-ply python3-yaml rsync unzip zstd file wget curl ccache \
            swig time xsltproc subversion patch pkgconf libtool autoconf automake \
            cmake ninja-build libgmp-dev libmpc-dev libmpfr-dev texinfo help2man \
            libgnutls28-dev gperf libfuse-dev device-tree-compiler qemu-utils
          sudo apt-get clean

      - name: 04 配置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'                      # DAED 前端环境

      - name: 05 安装 DAED 包管理器
        run: npm install --global pnpm@10.24.0    # 与锁文件匹配

      # 第二阶段：源码、配置、缓存和分类补丁
      - name: 06 下载源码并写入配置
        run: |
          set -euo pipefail
          git clone --depth 1 --single-branch --branch "$SOURCE_BRANCH" "$SOURCE_REPO" openwrt
          cp "$CONFIG_FILE" openwrt/.config
          test -s openwrt/.config
          mkdir -p openwrt/build-info

      - name: 07 恢复下载和编译缓存
        uses: actions/cache@v4
        with:
          # 多行 path 中只能写路径，不能加行尾注释
          path: |
            openwrt/dl
            openwrt/.ccache
          key: h68k-${{ runner.os }}-${{ hashFiles('config/**', 'patch/**') }}-${{ github.run_id }}
          restore-keys: |
            h68k-${{ runner.os }}-${{ hashFiles('config/**', 'patch/**') }}-
            h68k-${{ runner.os }}-

      - name: 08 安装插件源并应用补丁
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            # 按依赖顺序调用，不用通配符执行全部脚本
            python3 "../$PATCH_DIR/50-config.py" target
            bash "../$PATCH_DIR/10-feeds.sh"
            python3 "../$PATCH_DIR/20-packages.py"
            python3 "../$PATCH_DIR/21-daed.py"
            # SONiC 需要 feeds 中的 LuCI 等组件已就绪
            source "../$PATCH_DIR/common.sh"
            source_repo sonic https://github.com/mufeng05/openwrt-sonic-fullcone.git master
            python3 "../$PATCH_DIR/30-sonic.py"
            bash "../$PATCH_DIR/40-defaults.sh"
          } 2>&1 | tee ../prepare.log

      - name: 09 生成最终配置并检查功能
        working-directory: openwrt
        run: |
          set -euo pipefail
          {
            make defconfig
            python3 "../$PATCH_DIR/50-config.py" translations
            make defconfig
            # 防止缺少依赖时 defconfig 静默删除已选功能
            python3 "../$PATCH_DIR/50-config.py" config-check
          } 2>&1 | tee ../config.log

      # 第三阶段：下载 → 工具链 → BBRv3 内核 → 完整固件
      - name: 10 下载编译源码
        working-directory: openwrt
        run: |
          set -euo pipefail
          make download -j8 V=s 2>&1 | tee ../download.log

      - name: 11 编译工具与交叉工具链
        working-directory: openwrt
        run: |
          set -euo pipefail
          for target in tools/install toolchain/install; do
            # 并行失败后单线程重试，两份日志分别保存
            if ! make "$target" -j"$(nproc)" V=s 2>&1 | tee -a ../toolchain.log; then
              make "$target" -j1 V=s 2>&1 | tee -a ../toolchain-single.log
            fi
          done

      - name: 12 适配并验证 BBRv3 内核
        working-directory: openwrt
        run: |
          set -euo pipefail
          # 工具链完成后才运行，包含完整内核编译验证
          bash "../$PATCH_DIR/60-bbr3.sh" 2>&1 | tee ../kernel.log

      - name: 13 编译完整固件
        working-directory: openwrt
        run: |
          set -euo pipefail
          if ! make -j"$(nproc)" V=s 2>&1 | tee ../build-parallel.log; then
            make -j1 V=s 2>&1 | tee ../build-single.log
          fi

      - name: 14 验证固件并收集文件
        working-directory: openwrt
        run: |
          set -euo pipefail
          # 检查镜像、软件包清单、sha256sums 和最终 BBRv3 模块
          python3 "../$PATCH_DIR/70-verify.py" artifacts

      # 第四阶段：日志始终上传；固件和 Release 仅在验证成功后上传
      - name: 15 上传诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OPENWRT_NAME }}-Logs-${{ github.run_number }}
          path: |
            *.log
            openwrt/build-info
            openwrt/logs
            openwrt/target/linux/rockchip/patches-*/999-google-bbrv3.patch
          if-no-files-found: warn
          retention-days: 14

      - name: 16 上传完整目标输出
        if: success() && env.UPLOAD_BIN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OPENWRT_NAME }}-Bin-${{ github.run_number }}
          path: openwrt/bin/targets/
          if-no-files-found: error
          retention-days: 14

      - name: 17 上传已验证固件
        if: success() && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OPENWRT_NAME }}-Firmware-${{ github.run_number }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: 18 创建固件 Release
        if: success() && inputs.release && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 发布第 14 步已验证的文件，使用运行编号保证标签唯一
          tag="h68k-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          tar -czf release-assets/build-info.tar.gz -C release-assets build-info
          {
            echo '官方 OpenWrt main / HINLINK H68K / RK3568'
            echo "构建配置提交：$GITHUB_SHA"
            echo '包含 Google BBRv3、SONiC 全锥形 NAT 与 DAED。'
            echo '镜像、清单和 SHA256 已验证；CI 不替代实机启动测试。'
            cat openwrt/build-info/sources.txt
            cat openwrt/build-info/bbr.json
          } > release-notes.md
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" \
            --title "OpenWrt H68K $tag" --notes-file release-notes.md
