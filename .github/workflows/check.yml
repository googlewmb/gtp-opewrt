# 每次提交检查补丁语法、路径和失败保护
name: 补丁脚本检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    name: 验证补丁与锁文件
    runs-on: ubuntu-24.04
    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v5
      - name: 检查语法与回归测试
        run: |
          # 辅助脚本只检查语法，不作为构建阶段执行
          for file in patch/*.sh; do bash -n "$file"; done
          python3 -m compileall -q patch tests
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: 配置 DAED 验证环境
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: 实际验证 DAED 锁文件
        run: |
          python3 -m pip install PyYAML
          npm install -g pnpm@10.24.0
          git init /tmp/daed-lock-check
          git -C /tmp/daed-lock-check fetch --depth=1 https://github.com/daeuniverse/daed.git f045ecdd76cecce4e887a123dd45a9c25260f773
          git -C /tmp/daed-lock-check checkout FETCH_HEAD
          python3 patch/daed-lock.py /tmp/daed-lock-check
          cd /tmp/daed-lock-check
          # 保留 frozen 检查，避免重新解析依赖掩盖锁文件问题
          pnpm install --frozen-lockfile --lockfile-only --ignore-scripts --offline
